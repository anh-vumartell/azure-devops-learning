<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>My simple calculator</title>
</head>

<body>
  <main>
    <h1>My simple calculator</h1>
    
    <div class="calculator">
      <label for="num1">Number 1:</label>
      <input type="number" id="num1" placeholder="Enter first number">
      
      <label for="num2">Number 2:</label>
      <input type="number" id="num2" placeholder="Enter second number">
      
      <button onclick="calculateSum()">Calculate</button>
      
      <div id="result" class="result"></div>
    </div>
  </main>

  <script>
    function calculateSum() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      
      if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('result').textContent = 'Please enter valid numbers';
        return;
      }
      
      const sum = num1 + num2;
      document.getElementById('result').textContent = 'Sum: ' + sum;
    }

    // Optional: Calculate sum on Enter key press
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('num1').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') calculateSum();
      });
      document.getElementById('num2').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') calculateSum();
      });
    });
  </script>
</body>

</html>
